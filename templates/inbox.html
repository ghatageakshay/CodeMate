<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Messages - CodeMate</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <header class="app-header">
        <h1 class="app-header-brand">Your <span class="accent">Messages</span></h1>
        <nav class="app-nav" aria-label="Main">
            <a href="{{ url_for('dashboard') }}">Dashboard</a>
            <a href="{{ url_for('connections') }}">Connections</a>
            <a href="{{ url_for('find_devs') }}">Find Devs</a>
            <a href="{{ url_for('inbox') }}">Messages</a>
            <a href="{{ url_for('profile') }}">Profile</a>
            <a href="{{ url_for('logout') }}" class="nav-muted">Logout</a>
        </nav>
    </header>

    <div class="inbox-container">
        <h2>Inbox</h2>
        {% if conversations %}
            {% for c in conversations %}
                <div class="conversation-card">
                    <a href="{{ url_for('conversation', receiver_id=c[0]) }}">
                        💬 {{ c[1] }}
                    </a>
                </div>
            {% endfor %}
        {% else %}
            <div class="inbox-empty">
                <p>No conversations yet.</p>
                <p>Connect with developers and start messaging.</p>
                <p style="margin-top: 16px;"><a href="{{ url_for('dashboard') }}">Go to dashboard</a></p>
            </div>
        {% endif %}
    </div>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Find Devs - CodeMate</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
<style>
    body {
    margin: 0;
    background: #f9fafb;
    color: #0f172a;
}

.search-wrapper {
    max-width: 1100px;
    margin: 24px auto;
    padding: 0 24px;
}

.page-heading {
    max-width: 1100px;
    margin: 16px auto 0;
    padding: 0 24px;
}

.status-note {
    max-width: 1100px;
    margin: 8px auto 0;
    padding: 0 24px;
    color: #64748b;
    font-size: 0.9rem;
}

#search-input {
    width: 100%;
    padding: 12px 16px;
    border: 1px solid #e5e7eb;
    border-radius: 8px;
    font-size: 1rem;
    outline: none;
}

#search-input:focus {
    border-color: #2563eb;
}

#dev-cards-container {
    max-width: 1100px;
    margin: 0 auto;
    padding: 0 24px;
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
    gap: 20px;
}

.card {
    background: white;
    border: 1px solid #e5e7eb;
    border-radius: 12px;
    padding: 24px;
    box-shadow: 0 8px 20px rgba(0,0,0,0.05);
    transition: transform 0.2s ease;
}

.card:hover {
    transform: translateY(-4px);
    border-color: #2563eb;
}

.card h3 {
    margin: 0 0 8px;
    font-size: 1.25rem;
    color: #0f172a;
}

.card p {
    margin: 4px 0;
    color: #64748b;
    font-size: 0.9rem;
}

.card form {
    margin-top: 12px;
}

.card button[type="submit"] {
    padding: 10px 18px;
    border: none;
    border-radius: 8px;
    background: #2563eb;
    color: white;
    font-size: 0.9rem;
    font-weight: 500;
    cursor: pointer;
}

.card button[type="submit"]:hover {
    background: #1d4ed8;
}
</style>
</head>
<body>
    <header class="app-header">
        <h2 class="app-header-brand">Find <span class="accent">Devs</span></h2>
        <nav class="app-nav" aria-label="Main">
            <a href="{{ url_for('dashboard') }}">Dashboard</a>
            <a href="{{ url_for('connections') }}">Connections</a>
            <a href="{{ url_for('find_devs') }}">Find Devs</a>
            <a href="{{ url_for('inbox') }}">Messages</a>
            <a href="{{ url_for('profile') }}">Profile</a>
            <a href="{{ url_for('logout') }}" class="nav-muted">Logout</a>
        </nav>
    </header>
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}
      <div class="flash-stack">
        {% for category, message in messages %}
        <div class="flash-message {% if category == 'error' %}flash-error{% elif category == 'success' %}flash-success{% else %}flash-info{% endif %}">
            {{ message }}
        </div>
        {% endfor %}
      </div>
      {% endif %}
    {% endwith %}
    <div class="page-heading">
        <div class="breadcrumbs">
            <a href="{{ url_for('dashboard') }}">Dashboard</a><span class="sep">/</span><span>Find Devs</span>
        </div>
    </div>
    <div class="search-wrapper">
    <input type="search" id="search-input" placeholder="Search developers by name">
    </div>
    <p id="loading-indicator" class="status-note">Loading developers...</p>
    <div id="dev-cards-container">

    </div>
    <script>
const CONNECT_URL = "{{ url_for('connect') }}";
const API_USERS_URL = "{{ url_for('api_users') }}";
let allUsers = []
const container = document.getElementById("dev-cards-container")

// Step 1 - draw cards from whatever array is passed
function renderCards(users) {

    container.innerHTML = ""
    if (!users.length) {
        container.innerHTML = `
            <div class="empty-state" style="grid-column: 1 / -1;">
                <div class="empty-state-icon">🔎</div>
                <p>No developers match your search yet.</p>
                <p>Try a different name or clear the search field.</p>
            </div>
        `
        return
    }
    users.forEach(user => {
        
    let buttonHTML=""
    if(user.status === "none"){
        buttonHTML=`
            <form method="post" action="${CONNECT_URL}">
                <input type="hidden" name="receiver_id" value="${user.id}">
                <button type="submit">Connect</button>
            </form>
        `
    }
    else if(user.status === "pending"){
        buttonHTML = `<p style="color:gray;">Request Sent</p>`
    }

    else if(user.status === "accepted"){
        buttonHTML=`<p style="color:green;">Connected</p>`
    }
        container.innerHTML += `
            <div class="card">
                <h3>${user.name}</h3>
                <p>${user.skill_level}</p>
                <p>${user.interests}</p>
                 ${buttonHTML}
            </div>
        `
    })
}

// Step 2 - fetch users once when page loads
fetch(API_USERS_URL)
    .then(res => res.json())
    .then(users => {
        allUsers = users       // save to allUsers
        document.getElementById("loading-indicator").textContent = `${users.length} developers available`
        renderCards(users)      // draw all cards
    })
    .catch(() => {
        document.getElementById("loading-indicator").textContent = "Could not load developers right now."
    })

// Step 3 - search filter
document.getElementById("search-input").addEventListener("input", function() {
    const query = this.value.toLowerCase()
    const filtered = allUsers.filter(user => 
        user.name.toLowerCase().includes(query)
    )
    renderCards(filtered)
})
    </script>
</body>
</html>
